<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 稅務策略分析系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <aside class="w-64 bg-indigo-950 text-white flex flex-col shadow-2xl">
        <div class="p-6 border-b border-indigo-900">
            <h1 class="text-xl font-extrabold tracking-tight">稅務策略分析</h1>
            <div class="inline-block px-2 py-1 bg-indigo-500 text-[10px] rounded mt-2">VER 2026.05</div>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <div class="flex items-center p-3 bg-indigo-800 rounded-xl cursor-pointer">
                <i data-lucide="calculator" class="mr-3 w-5 h-5"></i> <span>個稅規劃中心</span>
            </div>
            <div class="flex items-center p-3 text-indigo-300 hover:bg-indigo-900 rounded-xl cursor-pointer">
                <i data-lucide="users" class="mr-3 w-5 h-5"></i> <span>遺產贈與分析</span>
            </div>
            <div class="flex items-center p-3 text-indigo-300 hover:bg-indigo-900 rounded-xl cursor-pointer">
                <i data-lucide="landmark" class="mr-3 w-5 h-5"></i> <span>營所稅務試算</span>
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex overflow-hidden">
        <div class="flex-1 p-10 overflow-y-auto">
            <div class="max-w-2xl mx-auto">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black text-slate-800">2026 稅務試算</h2>
                    <span class="text-slate-400 text-sm">Case: #2026-PRO</span>
                </div>

                <div class="space-y-8">
                    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-700 mb-6 flex items-center">
                            <i data-lucide="circle-dot" class="w-4 h-4 mr-2 text-indigo-600"></i> 年度綜合所得
                        </h3>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">綜合所得淨額 (NTD)</label>
                                <input type="number" id="netIncome" value="2000000" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-indigo-500 outline-none text-lg font-semibold">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-amber-600 mb-6 flex items-center">
                            <i data-lucide="shield-alert" class="w-4 h-4 mr-2"></i> 最低稅負 (AMT) 關鍵項目
                        </h3>
                        <div class="grid grid-cols-1 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">海外所得 (大於 100 萬計入)</label>
                                <input type="number" id="overseasIncome" value="0" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-amber-500 outline-none text-lg font-semibold">
                            </div>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">未上市股票增益</label>
                                    <input type="number" id="unlistedStock" value="0" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-amber-500 outline-none font-semibold">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase mb-2">人壽保險死亡給付</label>
                                    <input type="number" id="insurancePayout" value="0" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-xl focus:border-amber-500 outline-none font-semibold">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-[450px] bg-white border-l border-slate-200 p-10 shadow-2xl relative">
            <h3 class="text-xl font-bold text-slate-800 mb-10">策略分析結果</h3>

            <div class="space-y-8">
                <div class="flex justify-between items-center border-b border-slate-50 pb-4">
                    <span class="text-slate-500">一般所得稅額</span>
                    <span id="resRegular" class="text-xl font-mono font-bold text-slate-700">NT$ 0</span>
                </div>

                <div class="flex justify-between items-center border-b border-slate-50 pb-4">
                    <div>
                        <span class="text-slate-500">最低稅負額 (AMT)</span>
                        <div id="amtTag" class="hidden text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full font-bold mt-1">觸發差額繳納</div>
                    </div>
                    <span id="resAMT" class="text-xl font-mono font-bold text-slate-700">NT$ 0</span>
                </div>

                <div class="mt-12 p-8 bg-indigo-600 rounded-[2rem] text-white shadow-xl shadow-indigo-200">
                    <p class="text-indigo-200 text-xs font-bold uppercase tracking-widest mb-2">預計應繳稅總額</p>
                    <p id="resFinal" class="text-5xl font-black font-mono tracking-tighter">NT$ 0</p>
                </div>

                <div class="mt-10">
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">理專策略摘要</h4>
                    <div id="insightBox" class="p-4 bg-slate-50 rounded-2xl text-xs leading-relaxed text-slate-600 border border-slate-100">
                        </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 初始化圖示
        lucide.createIcons();

        function calculate() {
            // 取得輸入值
            const netIncome = parseFloat(document.getElementById('netIncome').value) || 0;
            const overseas = parseFloat(document.getElementById('overseasIncome').value) || 0;
            const unlisted = parseFloat(document.getElementById('unlistedStock').value) || 0;
            const insurance = parseFloat(document.getElementById('insurancePayout').value) || 0;

            // 1. 一般所得稅計算 (2026 累進級距)
            let regularTax = 0;
            if (netIncome <= 590000) regularTax = netIncome * 0.05;
            else if (netIncome <= 1330000) regularTax = netIncome * 0.12 - 41300;
            else if (netIncome <= 2660000) regularTax = netIncome * 0.20 - 147700;
            else if (netIncome <= 4980000) regularTax = netIncome * 0.30 - 413700;
            else regularTax = netIncome * 0.40 - 911700;

            // 2. 基本所得額 (AMT Base)
            // 2026 免稅額調整至 750 萬，保險免稅額 3740 萬
            let basicIncomeBase = netIncome;
            if (overseas >= 1000000) basicIncomeBase += overseas;
            basicIncomeBase += unlisted;
            basicIncomeBase += Math.max(0, insurance - 37400000);

            // 3. 基本稅額 (AMT)
            const basicTax = Math.max(0, (basicIncomeBase - 7500000) * 0.20);

            // 4. 結果呈現
            const finalTax = Math.max(regularTax, basicTax);
            const isAMT = basicTax > regularTax;

            document.getElementById('resRegular').innerText = 'NT$ ' + Math.floor(regularTax).toLocaleString();
            document.getElementById('resAMT').innerText = 'NT$ ' + Math.floor(basicTax).toLocaleString();
            document.getElementById('resFinal').innerText = 'NT$ ' + Math.floor(finalTax).toLocaleString();
            
            // UI 狀態切換
            const amtTag = document.getElementById('amtTag');
            const resAMT = document.getElementById('resAMT');
            const insightBox = document.getElementById('insightBox');

            if (isAMT) {
                amtTag.classList.remove('hidden');
                resAMT.classList.add('text-amber-600');
                insightBox.innerHTML = `<strong>⚠️ 稅務預警：</strong> 基本稅額已超過一般所得稅。建議理專針對客戶的海外資產配置進行調整，或評估保險受益人結構，目前您的基本所得額已達 NT$ ${Math.floor(basicIncomeBase).toLocaleString()}。`;
            } else {
                amtTag.classList.add('hidden');
                resAMT.classList.remove('text-amber-600');
                const remaining = 7500000 - (basicIncomeBase - netIncome);
                insightBox.innerHTML = `<strong>✅ 規劃空間：</strong> 目前所得配置尚在免稅門檻內。海外及特定所得還有約 <strong>NT$ ${Math.max(0, remaining).toLocaleString()}</strong> 的空間可供規劃。`;
            }
        }

        // 初始計算一次
        calculate();
    </script>
</body>
</html>
